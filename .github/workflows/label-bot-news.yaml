name: Label bot news
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] The job never checks out pull request code.
    types: [opened, reopened, synchronize]
permissions: {}
jobs:
  label:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: tox-dev/github-workflows/label-bot-news@cadf58a0dcc5d0c7853b248ab7c2b19bb93675d1
