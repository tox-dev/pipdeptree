name: Label bot news
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] The job never checks out pull request code.
    types: [opened, reopened, synchronize]
permissions: {}
jobs:
  label:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: tox-dev/github-workflows/label-bot-news@9a4e76e2f4901856f2784f6c0efc89278c518b1f
