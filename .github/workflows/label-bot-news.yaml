name: Label bot news
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] The job never checks out pull request code.
    types: [opened, reopened, synchronize]
permissions: {}
jobs:
  label:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
