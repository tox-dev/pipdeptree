name: Upgrade release tools
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 2"
permissions: {}
concurrency:
  group: upgrade-release-tools
  cancel-in-progress: false
jobs:
  upgrade:
    uses: tox-dev/github-workflows/.github/workflows/upgrade-release-tools.yaml@144f8e68b7d4c7c44e32258b1305e4402bc4e392
    permissions:
      actions: write
      contents: write
      pull-requests: write
    with:
      python-version: "3.15"
      check-workflow: check.yaml
      commit-message: "build(deps): refresh release lock"
      pull-request-title: "build(deps): refresh release tool lock"
      pull-request-body: |-
        Refresh the locked release tools to the latest versions allowed by the `release` dependency group.
        `pylock.toml` records the exact versions used during release preparation and GitHub note rendering.
