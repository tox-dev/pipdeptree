name: Prepare release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - auto
          - major
          - minor
          - patch
        default: auto
permissions: {}
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    uses: tox-dev/github-workflows/.github/workflows/prepare-towncrier-release.yaml@e8d429040f73cd95af722543a0a09717bf3bb0aa
    permissions:
      contents: read
      pull-requests: read
    with:
      bump: ${{ inputs.bump }}
      changelog: docs/changelog.rst
      fragments: docs/changelog
      format: rst
      annotated: true
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
