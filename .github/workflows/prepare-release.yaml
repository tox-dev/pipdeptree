name: Prepare release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump over the latest tag
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch
permissions:
  contents: read
jobs:
  prepare-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    environment: release-auth
    permissions:
      contents: read
    steps:
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # The next version comes from the tags.
          token: ${{ steps.token.outputs.token }}
          persist-credentials: true # zizmor: ignore[artipacked] the release script pushes main and its tag
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.15"
          enable-cache: false
      - name: Configure git
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
        run: |
          app_user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${app_user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
      - name: Require a news fragment
        run: |
          if ! compgen -G 'docs/changelog/*.*.rst' > /dev/null; then
            echo '::error::add a docs/changelog/*.rst fragment before preparing a release'
            exit 1
          fi
      - name: Tag the release
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: uvx --with tox-uv tox run -e release -- --bump "$BUMP"
