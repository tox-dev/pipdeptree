name: 🚀 Release to PyPI
on:
  push:
    tags: ["*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  dist:
    name: 🏗️ Build distributions
    uses: $/.github/workflows/dist.yaml
  dist-check:
    name: 🔍 Validate distributions
    needs: dist
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: 📩 Download distributions
        uses: actions/download-artifact@v8.0.2
        with:
          merge-multiple: true
          pattern: dists-*
          path: dist/
      - name: 🔍 Check bundled wheel libraries
        run: python3 tools/check_release_wheels.py dist
  notes:
    name: 📝 Render GitHub Release notes
    uses: tox-dev/github-workflows/.github/workflows/release-notes.yaml@81a3fc661be49ecdc4ea4af99a69fa3879b3d7a1 # 6.8.1
    permissions:
      contents: read
    with:
      tag: ${{ github.ref_name }}
      changelog: docs/changelog.rst
      artifact-url: https://pypi.org/project/pipdeptree/${{ github.ref_name }}/
  publish:
    name: 🚀 Publish to PyPI
    needs: [dist-check, notes]
    runs-on: ubuntu-26.04
    environment:
      name: release
      url: https://pypi.org/project/pipdeptree/${{ github.ref_name }}
    permissions:
      id-token: write
    steps:
      - name: 📩 Download distributions
        uses: actions/download-artifact@v8.0.2
        with:
          merge-multiple: true
          pattern: dists-*
          path: dist/
      - name: 🚀 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          packages-dir: dist
          attestations: true
  github-release:
    name: 🚀 Publish GitHub Release
    needs: [publish, notes]
    uses: tox-dev/github-workflows/.github/workflows/github-release.yaml@81a3fc661be49ecdc4ea4af99a69fa3879b3d7a1 # 6.8.1
    permissions:
      contents: write
    with:
      project: pipdeptree
      version: ${{ github.ref_name }}
      tag: ${{ github.ref_name }}
      artifact-pattern: dists-*
      notes-artifact-id: ${{ needs.notes.outputs.artifact-id }}
