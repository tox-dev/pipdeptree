name: Release to PyPI
on:
  push:
    tags: ["*"]
permissions:
  contents: read
jobs:
  dist:
    uses: $/.github/workflows/dist.yaml
  release:
    needs: dist
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/pipdeptree/${{ github.ref_name }}
    permissions:
      id-token: write
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          merge-multiple: true
          pattern: dists-*
          path: dist/
      - name: Check the dists carry the tag version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for path in dist/*; do
            case "${path#dist/}" in
              pipdeptree-"$TAG"-*.whl | pipdeptree-"$TAG".tar.gz) ;;
              *) echo "::error::$path is not version $TAG"; exit 1 ;;
            esac
          done
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
