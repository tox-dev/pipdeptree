name: Release to PyPI
on:
  push:
    tags: ["*"]
permissions:
  contents: read
jobs:
  dist:
    uses: $/.github/workflows/dist.yaml
  release:
    needs: dist
    runs-on: ubuntu-26.04
    environment:
      name: release
      url: https://pypi.org/project/pipdeptree/${{ github.ref_name }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require a changelog section for the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::unexpected release tag $TAG"
            exit 1
          fi
          if ! grep -qE "^ ${TAG//./\\.} \\(" docs/changelog.rst; then
            echo "::error::docs/changelog.rst has no section for $TAG"
            exit 1
          fi
      - name: Download all the dists
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          pattern: dists-*
          path: dist/
      - name: Check the dists carry the tag version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for path in dist/*; do
            case "${path#dist/}" in
              pipdeptree-"$TAG"-*.whl | pipdeptree-"$TAG".tar.gz) ;;
              *) echo "::error::$path is not version $TAG"; exit 1 ;;
            esac
          done
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
  github-release:
    needs: release
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
          enable-cache: false
      - name: Install locked release tools
        run: |
          set -euo pipefail
          uv venv --python 3.15 "$RUNNER_TEMP/release-tools"
          uv pip sync --preview-features pylock --python "$RUNNER_TEMP/release-tools/bin/python" --group release pylock.toml
          echo "$RUNNER_TEMP/release-tools/bin" >> "$GITHUB_PATH"
      - name: Fetch contributor metadata
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          previous=$(git tag --list | release-creator tags "$TAG" --previous)
          if [[ -n "$previous" ]]; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$TAG" -f previous_tag_name="$previous" --jq .body > "$RUNNER_TEMP/generated-notes.md"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$TAG" --jq .body > "$RUNNER_TEMP/generated-notes.md"
          fi
      - uses: tox-dev/github-workflows/render-release-notes@65ca97430da17d7c6f3cf636c0fd16dc3474481e
        with:
          tag: ${{ github.ref_name }}
          changelog: docs/changelog.rst
          repository: ${{ github.repository }}
          issue-role: issue
          artifact-url: https://pypi.org/project/pipdeptree/${{ github.ref_name }}/
          generated-notes: ${{ runner.temp }}/generated-notes.md
          output: ${{ runner.temp }}/release-notes.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
