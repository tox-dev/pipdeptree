name: 🧪 check
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags-ignore: ["**"]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "0 8 * * *"
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  dist:
    name: 🏗️ Build distributions
    uses: $/.github/workflows/dist.yaml
  rust:
    name: 🧪 Rust checks and tests
    runs-on: ubuntu-26.04
    env:
      PYTHONPATH: ${{ github.workspace }}/.python-packages
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 📦 Install Graphviz
        id: graphviz
        background: true
        run: sudo apt-get install graphviz -y
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: 📦 Install resolver dependencies
        run: uv pip install --target .python-packages 'nab>=0.0.17' 'nab-index>=0.0.17' 'nab-project>=0.0.17'
      - name: 🧹 Check formatting
        run: cargo fmt --all --check
      - name: 🧹 Check lints
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: 🦀 Install coverage tool
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov
      - name: ⏳ Wait for Graphviz
        wait: graphviz
      - name: 🧪 Run tests with coverage
        run: cargo llvm-cov --no-default-features --test public_api --fail-under-lines 100 --fail-under-functions 100
  test:
    name: 🧪 Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - windows-2025
        env:
          - "pypy-3.11"
          - "3.15"
          - "3.15t"
          - "3.14"
          - "3.13"
          - "3.12"
          - "3.11"
          - type
          - docs
          - dev
          - pkg_meta
        exclude:
          # Run non-runtime checks only on Linux
          - os: windows-2025
            env: type
          - os: windows-2025
            env: docs
          - os: windows-2025
            env: dev
          - os: windows-2025
            env: pkg_meta
    steps:
      - name: 📦 Install Graphviz
        if: runner.os == 'Linux'
        run: sudo apt-get install graphviz -y
      - name: 📦 Install OS dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          foreach ($attempt in 1..3) {
            choco install graphviz -y --no-progress --fail-on-unfound
            if ($LASTEXITCODE -eq 0 -and (Get-Command dot -ErrorAction SilentlyContinue)) { break }
            Start-Sleep -Seconds (30 * $attempt)
          }
          dot -V
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
          cache-dependency-glob: "pyproject.toml"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: 📦 Install tox
        run: uv tool install --python-preference only-managed --python 3.15 tox --with tox-uv
      - name: 🐍 Install Python
        if: (startsWith(matrix.env, '3.') || startsWith(matrix.env, 'pypy-')) && matrix.env != '3.15'
        run: uv python install --python-preference only-managed ${{ matrix.env }}
      - name: 📦 Set up test suite
        run: tox run -vv --notest --skip-missing-interpreters false -e ${{ matrix.env }}
      - name: 🧪 Run test suite
        run: tox run --skip-pkg-install -e ${{ matrix.env }}
        env:
          PYTEST_ADDOPTS: "-vv --durations=20"
          DIFF_AGAINST: HEAD
  # The one context branch protection requires, so a matrix that grows or renames its cells needs no ruleset edit.
  check:
    name: 🚦 ${{ github.event_name == 'pull_request' && 'Required checks pass' || 'Non-PR checks pass' }}
    needs: [dist, rust, test]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: 🚦 Require all needed jobs to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: jq -e 'all(to_entries[]; .value.result == "success")' <<<"$NEEDS_JSON"
