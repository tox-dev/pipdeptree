name: check
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags-ignore: ["**"]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    - cron: "0 8 * * *"
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  dist:
    uses: $/.github/workflows/dist.yaml
  rust:
    runs-on: ubuntu-26.04
    env:
      PYTHONPATH: ${{ github.workspace }}/.python-packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Graphviz
        id: graphviz
        background: true
        run: sudo apt-get install graphviz -y
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: Install resolver dependencies
        run: uv pip install --target .python-packages 'nab>=0.0.17' 'nab-index>=0.0.17' 'nab-project>=0.0.17'
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check lints
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Install coverage tool
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-llvm-cov
      - wait: graphviz
      - name: Run tests with coverage
        run: cargo llvm-cov --no-default-features --test public_api --fail-under-lines 100 --fail-under-functions 100
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - windows-2025
        env:
          - "pypy-3.11"
          - "3.15"
          - "3.15t"
          - "3.14"
          - "3.13"
          - "3.12"
          - "3.11"
          - type
          - docs
          - dev
          - pkg_meta
        exclude:
          # Run non-runtime checks only on Linux
          - os: windows-2025
            env: type
          - os: windows-2025
            env: docs
          - os: windows-2025
            env: dev
          - os: windows-2025
            env: pkg_meta
    steps:
      - name: Install OS dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install graphviz -y
      - name: Install OS dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          foreach ($attempt in 1..3) {
            choco install graphviz -y --no-progress --fail-on-unfound
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds (30 * $attempt)
          }
          dot -V
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
          cache-dependency-glob: "pyproject.toml"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install tox
        run: uv tool install --python-preference only-managed --python 3.15 tox --with tox-uv
      - name: Install Python
        if: (startsWith(matrix.env, '3.') || startsWith(matrix.env, 'pypy-')) && matrix.env != '3.15'
        run: uv python install --python-preference only-managed ${{ matrix.env }}
      - name: Setup test suite
        run: tox run -vv --notest --skip-missing-interpreters false -e ${{ matrix.env }}
      - name: Run test suite
        run: tox run --skip-pkg-install -e ${{ matrix.env }}
        env:
          PYTEST_ADDOPTS: "-vv --durations=20"
          DIFF_AGAINST: HEAD
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: Install locked release tools
        uses: tox-dev/github-workflows/install-locked-tools@24e7c78489b6e2adb7b8f881761a5c2dbfe03fee
        with:
          venv: ${{ runner.temp }}/release-tools
      - name: Add installed tools to PATH
        run: echo "$RUNNER_TEMP/release-tools/bin" >>"$GITHUB_PATH"
      - uses: tox-dev/github-workflows/validate-news@24e7c78489b6e2adb7b8f881761a5c2dbfe03fee
  hook-update-cooldown:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - uses: tox-dev/github-workflows/check-hook-update-cooldown@24e7c78489b6e2adb7b8f881761a5c2dbfe03fee
        with:
          repository: ${{ github.repository }}
          pull-request: ${{ github.event.pull_request.number }}
          head-sha: ${{ github.event.pull_request.head.sha }}
  # The one context branch protection requires, so a matrix that grows or renames its cells needs no ruleset edit.
  check:
    needs: [dist, rust, test, changelog, hook-update-cooldown]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          jq -e --arg event "$EVENT_NAME" '
            all(
              to_entries[];
              .value.result == "success" or
              ((.key == "changelog" or .key == "hook-update-cooldown") and
               .value.result == "skipped" and $event != "pull_request")
            )
          ' <<<"$NEEDS_JSON"
