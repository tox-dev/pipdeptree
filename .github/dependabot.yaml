version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    labels:
      - dependencies
      - github_actions
      - skip news
    schedule:
      interval: "weekly"
      day: "tuesday"
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: "cargo"
    directory: "/"
    labels:
      - dependencies
      - skip news
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "14:00"
    groups:
      cargo:
        patterns:
          - "*"
  - package-ecosystem: "rust-toolchain"
    directory: "/"
    labels:
      - dependencies
      - skip news
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "14:00"
    groups:
      rust-toolchain:
        patterns:
          - "*"
  - package-ecosystem: "pre-commit"
    directory: "/"
    labels:
      - dependencies
      - skip news
    schedule:
      interval: "weekly"
      day: "tuesday"
    cooldown:
      default-days: 7
