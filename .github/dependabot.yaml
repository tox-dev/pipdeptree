version: 2
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
      day: tuesday
    labels:
      - dependencies
      - skip news
updates:
  - package-ecosystem: github-actions
    directory: /
    patterns:
      - '*'
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 7
  - package-ecosystem: cargo
    directory: /
    patterns:
      - '*'
    multi-ecosystem-group: dependencies
  - package-ecosystem: rust-toolchain
    directory: /
    patterns:
      - '*'
    multi-ecosystem-group: dependencies
  - package-ecosystem: pre-commit
    directory: /
    patterns:
      - '*'
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 7
