# prek runs lower priorities first and equal ones concurrently, so hooks sharing a priority never write the same
# file; pre-commit ignores the key and runs hooks in file order.
ci:
  autoupdate_schedule: quarterly
default_language_version:
  python: python3.15
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: end-of-file-fixer
        priority: 1
      - id: trailing-whitespace
        priority: 2
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: a76b92851fc9eede9f9bc4073eb55202f34eb0df # frozen: 0.39.0
    hooks:
      - id: check-github-workflows
        priority: 8
        args: ["--verbose"]
  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8 # frozen: v2.4.3
    hooks:
      - id: codespell
        priority: 8
  - repo: https://github.com/tox-dev/tox-toml-fmt
    rev: "522f1a9f55dca6596a20adaae2f1f08e61c0f0a4" # frozen: v1.11.3
    hooks:
      - id: tox-toml-fmt
        priority: 3
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: "3c6e76e10abcae02303212289efed3413350769c" # frozen: v2.30.6
    hooks:
      - id: pyproject-fmt
        priority: 3
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "c0f278f1254ccc8fb09676bcdb8d847e7db493e5" # frozen: v0.17.4
    hooks:
      - id: ruff-check
        priority: 5
        args: ["--fix", "--unsafe-fixes", "--exit-non-zero-on-fix"]
  - repo: https://github.com/henryiii/flake8-lazy
    rev: 7f268b3b3aaf7feca756ca610e37971382976365 # frozen: v0.11.0
    hooks:
      - id: flake8-lazy
        priority: 4
        files: ^src/pipdeptree/
  - repo: https://github.com/gaborbernat/simplint-pre-commit
    rev: "6f12a88d7d6ebf3dd09ebddb1e6541e533d4efe0" # frozen: v0.14.2
    hooks:
      - id: simplint
        priority: 6
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "c0f278f1254ccc8fb09676bcdb8d847e7db493e5" # frozen: v0.17.4
    hooks:
      - id: ruff-format
        priority: 7
  - repo: https://github.com/google/yamlfmt
    rev: "21ca5323a9c87ee37a434e0ca908efc0a89daa07" # frozen: v0.21.0
    hooks:
      - id: yamlfmt
        priority: 3
  - repo: https://github.com/hukkin/mdformat
    rev: 82912cdaea4fb830f751504486a7879c70526547 # frozen: 1.0.0
    hooks:
      - id: mdformat
        priority: 3
        args: ["--wrap", "120"]
        additional_dependencies:
          - mdformat-gfm==1.0.0
          - mdformat-ruff==0.1.3
  - repo: https://github.com/LilSpazJoekp/docstrfmt
    rev: c1813841673cdcd6cf602dde1edb78a5d5e45235 # frozen: v2.2.1
    hooks:
      - id: docstrfmt
        priority: 3
        files: |
          (?x)
          ^docs/changelog[.]rst$  # Only the generated release history.
        args: ["-l", "120", "--preserve-adornments"]
        additional_dependencies:
          - "sphinx==9.2.0"
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7 # frozen: v1.32.0
    hooks:
      - id: zizmor
        priority: 8
  - repo: meta
    hooks:
      - id: check-hooks-apply
        priority: 8
      - id: check-useless-excludes
        priority: 8
