[build-system]
build-backend = "mesonpy"
requires = [
  "hatch-fancy-pypi-readme>=23.2",
  "meson>=1.12.1",
  "meson-python>=0.22.1",
  "ninja>=1.13.2",
  "patchelf>=0.11; sys_platform=='linux'",
  "scikit-build-core>=0.10",
  "setuptools-scm",
]

[project]
name = "pipdeptree"
import-names = [ "pipdeptree" ]
description = "Command line utility to show dependency tree of packages."
readme = "README.md"
keywords = [
  "dependencies",
  "dependency-tree",
  "packages",
]
license = "MIT"
license-files = [
  "LICENSE",
]
maintainers = [
  { name = "Bernát Gábor", email = "gaborjbernat@gmail.com" },
  { name = "Kemal Zebari", email = "kemalzebra@gmail.com" },
  { name = "Vineet Naik", email = "naikvin@gmail.com" },
]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Rust",
]
dynamic = [
  "version",
]
dependencies = [
  "nab>=0.0.19",
  "nab-index>=0.0.19",
  "nab-project>=0.0.19",
]
urls.Changelog = "https://pipdeptree.readthedocs.io/en/latest/changelog.html"
urls.Documentation = "https://pipdeptree.readthedocs.io"
urls.Homepage = "https://github.com/tox-dev/pipdeptree"
urls.Source = "https://github.com/tox-dev/pipdeptree"
urls.Tracker = "https://github.com/tox-dev/pipdeptree/issues"
scripts.pipdeptree = "pipdeptree._runner:main"

[dependency-groups]
test = [
  "covdefaults>=2.3",
  "diff-cover>=10.6",
  "pytest>=9.1.1",
  "pytest-cov>=7.1",
  "pytest-mock>=3.15",
]
docs = [
  "furo>=2025.12.19",
  "sphinx>=9.1",
  "sphinx-copybutton>=0.5.2",
  "sphinx-inline-tabs>=2025.12.21.14",
  "sphinx-llm!=1.1,>=1",
  "sphinxcontrib-mermaid>=2.1.1",
  "sphinxcontrib-towncrier>=0.5.0a0",
  "towncrier>=26.9",
]
build = [
  "cython>=3",
  "hatch-fancy-pypi-readme>=23.2",
  "meson>=1.12.1",
  "meson-python>=0.22.1",
  "ninja>=1.13.2",
  "patchelf>=0.11; sys_platform=='linux'",
  "scikit-build-core>=0.10",
  "setuptools>=80",
  "setuptools-scm",
]
release-news = [
  "release-creator>=4.1",
  "towncrier>=26.9",
]
release-notes = [
  "release-creator>=4.1",
]
release-prepare = [
  "prek>=0.5",
  "release-creator>=4.1",
  "towncrier>=26.9",
]
release-preview = [
  "uv>=0.12.22",
  { include-group = "release-prepare" },
]
release-wheel = [
  "release-creator>=4.1",
  "wheel>=0.46",
]

[tool.meson-python]
limited-api = true

[tool.uv]
dependency-groups.docs = { requires-python = ">=3.12" }
dependency-groups.release-news = { requires-python = ">=3.15" }
dependency-groups.release-notes = { requires-python = ">=3.15" }
dependency-groups.release-prepare = { requires-python = ">=3.15" }
dependency-groups.release-wheel = { requires-python = ">=3.15" }

[tool.ruff]
line-length = 120
format.preview = true
format.docstring-code-line-length = 100
format.docstring-code-format = true
lint.select = [
  "ALL",
]
lint.ignore = [
  "any-type",                                  # Expressions typed as typing.Any are disallowed in
  "assert",                                    # asserts allowed
  "CPY",                                       # No copyright statements
  "docstring-missing-exception",               # Blocked by Ruff's incomplete Sphinx-style docstring support (astral-sh/ruff#12434)
  "docstring-missing-returns",                 # Blocked by Ruff's incomplete Sphinx-style docstring support (astral-sh/ruff#12434)
  "docstring-missing-yields",                  # Blocked by Ruff's incomplete Sphinx-style docstring support (astral-sh/ruff#12434)
  "hardcoded-bind-all-interfaces",             # Possible binding to all interface
  "implicit-namespace-package",                # no implicit namespace
  "incorrect-blank-line-before-class",         # `one-blank-line-before-class` (D203) and `no-blank-line-before-class` (D211) are incompatible
  "magic-value-comparison",                    # Magic value used in comparison
  "missing-trailing-comma",                    # Conflict with formatter
  "multi-line-summary-first-line",             # `multi-line-summary-first-line` (D212) and `multi-line-summary-second-line` (D213) are incompatible
  "non-empty-init-module",                     # `__init__` module should only contain docstrings and re-exports
  "single-line-implicit-string-concatenation", # Conflict with formatter
  "stdlib-module-shadowing",                   # Allow builtin module shadowing
  "undocumented-public-package",               # Missing docstring in public package
]
lint.per-file-ignores."tests/**/*.py" = [
  "D",                                    # Documentation rules do not apply to tests
  "FBT",                                  # Boolean positional arguments keep parameterized tests compact
  "import-private-name",                  # Private import in tests
  "magic-value-comparison",               # Magic value used in comparison, consider replacing with a constant variable
  "subprocess-without-shell-equals-true", # `subprocess` call: check for execution of untrusted input
  "too-many-arguments",                   # any number of arguments in tests
  "too-many-positional-arguments",        # any number of arguments in tests
]
lint.isort = { known-first-party = [
  "pipdeptree",
], required-imports = [
  "from __future__ import annotations",
] }
lint.pylint.allow-dunder-method-names = [ "_repr_mimebundle_" ]
lint.preview = true

[tool.codespell]
builtin = "clear,usage,en-GB_to_en-US"
# Cargo uses the writeable crate, and serde exposes serializer traits through ser.
ignore-words-list = "master,ser,writeable"
count = true
quiet-level = 3

[tool.pyproject-fmt]
max_supported_python = "3.15"

[tool.ty]
src.exclude = []
environment.python-version = "3.15"

[tool.coverage]
run.parallel = true
run.plugins = [
  "covdefaults",
]
paths.source = [
  "src",
  ".tox/*/lib/python*/site-packages",
  "*/src",
]
report.fail_under = 100
html.show_contexts = true
html.skip_covered = false
subtract_omit = "*/__main__.py"

[tool.towncrier]
directory = "docs/changelog"
filename = "docs/changelog.rst"
template = "docs/changelog/template.jinja2"
title_format = false
issue_format = ""
type = [
  { directory = "feature", name = "Added", showcontent = true },
  { directory = "change", name = "Changes", showcontent = true },
  { directory = "bugfix", name = "Fixed", showcontent = true },
  { directory = "doc", name = "Documentation", showcontent = true },
  { directory = "security", name = "Security", showcontent = true },
  { directory = "performance", name = "Performance", showcontent = true },
  { directory = "deprecation", name = "Deprecated", showcontent = true },
  { directory = "removal", name = "Removed", showcontent = true },
  { directory = "breaking", name = "Breaking changes", showcontent = true },
  { directory = "packaging", name = "Packaging", showcontent = true },
]

[tool.nab]
mode = "universal"
base-group = "project-runtime"
default-groups = []
uploaded-prior-to = "P7D"
decision-order = "stable"
matrix.python = ">=3.15,<3.16"
matrix.platforms = [
  "linux_x86_64",
  "linux_aarch64",
  "macos_x86_64",
  "macos_arm64",
  "windows_amd64",
  "windows_arm64",
]
matrix.overrides.implementations.pypy.python = "==3.11"
matrix.overrides.implementations.pypy.platforms = [
  "linux_x86_64",
  "linux_aarch64",
  "macos_x86_64",
  "macos_arm64",
  "windows_amd64"
]
# temporary, delete after 2026-11-02
packages.release-creator.uploaded-prior-to = 2026-10-26T18:24:46Z
