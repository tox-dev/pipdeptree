[build-system]
build-backend = "python_sbom.backend"
requires = [
  "hatch-fancy-pypi-readme>=23.2",
  "meson>=1.12.1",
  "meson-python>=0.22.1",
  "ninja>=1.13.2",
  "patchelf>=0.11; sys_platform=='linux'",
  "python-sbom>=0.2",
  "scikit-build-core>=0.10",
  "setuptools-scm",
]

[project]
name = "pipdeptree"
import-names = [ "pipdeptree" ]
description = "Command line utility to show dependency tree of packages."
readme = "README.md"
keywords = [
  "dependencies",
  "dependency-tree",
  "packages",
]
license = "MIT"
license-files = [
  "LICENSE",
]
maintainers = [
  { name = "Bernát Gábor", email = "gaborjbernat@gmail.com" },
  { name = "Kemal Zebari", email = "kemalzebra@gmail.com" },
  { name = "Vineet Naik", email = "naikvin@gmail.com" },
]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Rust",
]
dynamic = [
  "version",
]
dependencies = [
  "nab>=0.0.19",
  "nab-index>=0.0.19",
  "nab-project>=0.0.19",
]
urls.Changelog = "https://pipdeptree.readthedocs.io/en/latest/changelog.html"
urls.Documentation = "https://pipdeptree.readthedocs.io"
urls.Homepage = "https://github.com/tox-dev/pipdeptree"
urls.Source = "https://github.com/tox-dev/pipdeptree"
urls.Tracker = "https://github.com/tox-dev/pipdeptree/issues"
scripts.pipdeptree = "pipdeptree._runner:main"

[dependency-groups]
test = [
  "covdefaults>=2.3",
  "diff-cover>=10.6",
  "pytest>=9.1.1",
  "pytest-cov>=7.1",
  "pytest-mock>=3.15",
]
docs = [
  "furo>=2025.12.19",
  "sphinx>=9.1",
  "sphinx-copybutton>=0.5.2",
  "sphinx-inline-tabs>=2025.12.21.14",
  "sphinx-llm!=1.1,>=1",
  "sphinxcontrib-mermaid>=2.1.1",
  "sphinxcontrib-towncrier>=0.5.0a0",
  "towncrier>=26.9",
]
build = [
  "cython>=3",
  "hatch-fancy-pypi-readme>=23.2",
  "meson>=1.12.1",
  "meson-python>=0.22.1",
  "ninja>=1.13.2",
  "patchelf>=0.11; sys_platform=='linux'",
  "python-sbom>=0.2",
  "scikit-build-core>=0.10",
  "setuptools>=80",
  "setuptools-scm",
]
release-news = [
  "release-creator>=4.4",
  "towncrier>=26.9",
]
release-notes = [
  "release-creator>=4.4",
]
release-prepare = [
  "prek>=0.5",
  "release-creator>=4.4",
  "towncrier>=26.9",
]
release-preview = [
  "uv>=0.12.22",
  { include-group = "release-prepare" },
]
release-wheel = [
  "release-creator>=4.4",
  "wheel>=0.46",
]

[tool.meson-python]
limited-api = true

[tool.uv]
dependency-groups.docs = { requires-python = ">=3.12" }
dependency-groups.release-news = { requires-python = ">=3.15" }
dependency-groups.release-notes = { requires-python = ">=3.15" }
dependency-groups.release-prepare = { requires-python = ">=3.15" }
dependency-groups.release-wheel = { requires-python = ">=3.15" }

[tool.ruff]
line-length = 120
format.preview = true
format.docstring-code-line-length = 100
format.docstring-code-format = true
lint.select = [
  "ALL",
]
lint.ignore = [
  "CPY",                                       # No copyright statements
  "docstring-missing-exception",               # Blocked by Ruff's incomplete Sphinx-style docstring support (astral-sh/ruff#12434)
  "docstring-missing-returns",                 # Blocked by Ruff's incomplete Sphinx-style docstring support (astral-sh/ruff#12434)
  "docstring-missing-yields",                  # Blocked by Ruff's incomplete Sphinx-style docstring support (astral-sh/ruff#12434)
  "incorrect-blank-line-before-class",         # Conflicts with `blank-line-before-class`
  "missing-trailing-comma",                    # Conflict with formatter
  "multi-line-summary-first-line",             # Conflicts with `multi-line-summary-second-line`
  "single-line-implicit-string-concatenation", # Conflict with formatter
  "undocumented-magic-method",                 # undocumented-public-api (simplint) covers the public API instead
  "undocumented-public-class",                 # undocumented-public-api (simplint) covers the public API instead
  "undocumented-public-function",              # undocumented-public-api (simplint) covers the public API instead
  "undocumented-public-init",                  # undocumented-public-api (simplint) covers the public API instead
  "undocumented-public-method",                # undocumented-public-api (simplint) covers the public API instead
  "undocumented-public-nested-class",          # undocumented-public-api (simplint) covers the public API instead
  "unnecessary-regular-expression-compile",    # conflicts with simplint inline-regex
]
lint.per-file-ignores."docs/conf.py" = [
  "implicit-namespace-package", # Sphinx configuration is not an importable package
]
lint.per-file-ignores."tests/**/*.py" = [
  "assert",                               # pytest assertions
  "D",                                    # Documentation rules do not apply to tests
  "FBT",                                  # Boolean positional arguments keep parameterized tests compact
  "magic-value-comparison",               # Assertions compare expected literals
  "subprocess-without-shell-equals-true", # Tests invoke fixed commands and control their arguments
  "too-many-arguments",                   # Pytest fixtures supply test function arguments
  "too-many-positional-arguments",        # Pytest fixtures supply test function arguments
]
lint.isort = { known-first-party = [
  "pipdeptree",
], required-imports = [
  "from __future__ import annotations",
] }
lint.pylint.allow-dunder-method-names = [ "_repr_mimebundle_" ]
lint.preview = true

[tool.codespell]
builtin = "clear,usage,en-GB_to_en-US"
# Cargo uses the writeable crate, and serde exposes serializer traits through ser.
ignore-words-list = "ser,writeable"
count = true
quiet-level = 3

[tool.pyproject-fmt]
max_supported_python = "3.15"

[tool.ty]
src.exclude = []
environment.python-version = "3.15"

[tool.coverage]
run.parallel = true
run.plugins = [
  "covdefaults",
]
paths.source = [
  "src",
  ".tox/*/lib/python*/site-packages",
  "*/src",
]
report.fail_under = 100
html.show_contexts = true
html.skip_covered = false
subtract_omit = "*/__main__.py"

[tool.towncrier]
directory = "docs/changelog"
filename = "docs/changelog.rst"
template = "docs/changelog/template.jinja2"
title_format = false
issue_format = ""
type = [
  { directory = "feature", name = "Added", showcontent = true },
  { directory = "change", name = "Changes", showcontent = true },
  { directory = "bugfix", name = "Fixed", showcontent = true },
  { directory = "doc", name = "Documentation", showcontent = true },
  { directory = "security", name = "Security", showcontent = true },
  { directory = "performance", name = "Performance", showcontent = true },
  { directory = "deprecation", name = "Deprecated", showcontent = true },
  { directory = "removal", name = "Removed", showcontent = true },
  { directory = "breaking", name = "Breaking changes", showcontent = true },
  { directory = "packaging", name = "Packaging", showcontent = true },
]

[tool.python-sbom]
build-backend = "mesonpy"
supplier = { name = "tox-dev", url = [ "https://github.com/tox-dev" ] }

[tool.nab]
mode = "universal"
base-group = "project-runtime"
default-groups = []
uploaded-prior-to = "P7D"
decision-order = "stable"
matrix.python = ">=3.15,<3.16"
matrix.platforms = [
  "linux_x86_64",
  "linux_aarch64",
  "macos_x86_64",
  "macos_arm64",
  "windows_amd64",
  "windows_arm64",
]
matrix.overrides.implementations.pypy.python = "==3.11"
matrix.overrides.implementations.pypy.platforms = [
  "linux_x86_64",
  "linux_aarch64",
  "macos_x86_64",
  "macos_arm64",
  "windows_amd64"
]
# release-creator 4.4.0 needs a seven-day cutoff exception.
# expires 2026-11-16
packages.release-creator.uploaded-prior-to = 2026-11-02T21:45:00Z
# python-sbom 0.2.0 needs a seven-day cutoff exception.
# expires 2026-11-16
packages.python-sbom.uploaded-prior-to = 2026-11-09T19:56:00Z

[tool.simplint]
docstring-style = "rst"
